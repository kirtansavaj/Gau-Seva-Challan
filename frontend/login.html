<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gau Seva Admin</title>
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="./images/logo.png" alt="Gau Seva Logo" class="login-logo">
                <h1>Welcome Back</h1>
                <p>Sign in to manage Gau Seva Dashboard</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username" style="font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; display: block; color: var(--text-main);">Username or Email</label>
                    <div class="input-with-icon">
                        <i class='bx bx-user'></i>
                        <input type="text" id="username" name="username" required placeholder="Enter your username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password" style="font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; display: block; color: var(--text-main);">Password</label>
                    <div class="input-with-icon">
                        <i class='bx bx-lock-alt'></i>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>
                </div>
                
                <div id="loginError" class="error-message hidden">
                    <i class='bx bx-error-circle'></i>
                    <span id="loginErrorText">Invalid credentials</span>
                </div>
                
                <button type="submit" class="btn btn-primary login-btn" id="btnLogin">
                    Sign In <i class='bx bx-right-arrow-alt'></i>
                </button>
            </form>
        </div>
    </div>
    
    <script type="module" src="js/auth/auth.js"></script>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
