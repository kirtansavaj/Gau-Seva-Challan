<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Gau Seva</title>
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/profile.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="./images/logo.png" alt="Logo" class="nav-logo">
            <span class="nav-brand-text">Vaishnav Gau Seva Parivar Surat</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class='bx bx-grid-alt'></i> Dashboard</a></li>
            <li><a href="new-challan.html"><i class='bx bx-plus-circle'></i> New Challan</a></li>
            <li><a href="history.html"><i class='bx bx-history'></i> Challan History</a></li>
        </ul>
        <div class="nav-bottom">
            <a href="#" id="logoutBtn" class="logout-link"><i class='bx bx-log-out'></i> Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle Navigation Menu">
                <i class="bx bx-menu"></i>
            </button>
            <div class="search-bar" style="visibility: hidden;">
                <i class='bx bx-search'></i>
                <input type="text" placeholder="Search...">
            </div>
            <a href="profile.html" class="user-profile" style="background: var(--bg-body); border-color: var(--primary-light);">
                <div class="avatar">A</div>
                <div style="display: flex; flex-direction: column;">
                    <span class="profile-name">Admin</span>
                </div>
            </a>
        </header>

        <div id="toast" class="toast hidden"></div>

        <section id="profile" class="page-section">
            <h2 class="section-title text-center" style="margin-bottom: 2rem;">Admin Profile</h2>
            
            <div class="profile-container">
                <div class="profile-header">
                    <div class="large-avatar">A</div>
                    <div>
                        <h3 id="displayUsername">Admin Name</h3>
                        <p id="displayAdminEmail">admin@gauseva.com</p>
                    </div>
                </div>

                <form id="profileForm" class="profile-form">
                    <div class="form-section">
                        <h4>Profile Details</h4>
                        <div class="form-group">
                            <label for="username">Username / Full Name</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                    </div>



                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="btnSave">Save Changes</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="js/utils/navigation.js"></script>
    <script type="module" src="js/auth/auth.js"></script>
    <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
